
<html lang="id">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title id="pageTitle">MMK | MODS</title>
	<meta id="metaDesc" name="description" content="Ekosistem & Database Aplikasi Android Modded Premium dari MMK Team.">

	<meta id="ogType" property="og:type" content="website">
	<meta id="ogUrl" property="og:url" content="">
	<meta id="ogTitle" property="og:title" content="MMK | MODS">
	<meta id="ogDesc" property="og:description" content="Ekosistem & Database Aplikasi Android Modded Premium dari MMK Team.">
	<meta id="ogImage" property="og:image" content="https://diverse-aqua-iq7wghij.edgeone.app/M.png">

	<meta name="twitter:card" content="summary_large_image">
	<meta id="twTitle" name="twitter:title" content="MMK | MODS">
	<meta id="twDesc" name="twitter:description" content="Ekosistem & Database Aplikasi Android Modded Premium dari MMK Team.">
	<meta id="twImage" name="twitter:image" content="https://diverse-aqua-iq7wghij.edgeone.app/M.png">

	<link rel="stylesheet" href="style.css">
<style>
  body { padding-top: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .share-page-card { max-width: 420px; width: 100%; }
  .share-brand-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .share-brand-row img { width: 28px; height: 28px; border-radius: 6px; }
  .share-brand-row span { font-weight: 900; letter-spacing: 1.5px; color: #fff; font-size: 0.95rem; }
  .apk-icon-frame { width: 84px; height: 84px; font-size: 2.2rem; }
  .apk-title { white-space: normal !important; font-size: 1.3rem; }
  .share-back-link { display: block; text-align: center; margin-top: 14px; color: var(--accent); font-size: 0.82rem; text-decoration: none; }
  .share-back-link:hover { text-decoration: underline; }
  .share-status { text-align: center; color: var(--text-muted); padding: 30px 10px; }
</style>
  </head>
  <body>
	<div class="share-page-card">
	  <div class="share-brand-row">
		<img src="https://diverse-aqua-iq7wghij.edgeone.app/M.png" alt="MMK MODS">
		<span>MMK | MODS</span>
	  </div>
	  <div id="shareContent" class="share-status">Memuat data aplikasi…</div>
	</div>

	<script src="apks.js"></script>
<script>
(function () {
    function esc(str) {
        return (str || '').toString()
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
            .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function slugify(name) {
        return (name || '').toString().toLowerCase().trim()
            .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
    }

    const params = new URLSearchParams(window.location.search);
    const target = params.get('app') || '';
    const container = document.getElementById('shareContent');

    // Prioritaskan data lokal (kalau admin sedang edit di browser ini), fallback ke apks.js bawaan repo
    let list = (typeof apks !== 'undefined') ? apks : [];
    try {
        const localData = localStorage.getItem('mmk_local_apks');
        if (localData) list = JSON.parse(localData);
    } catch (e) {}

    const item = list.find(a =>
        (a.name || '').toLowerCase() === target.toLowerCase() ||
        slugify(a.name) === slugify(target)
    );

    if (!item) {
        container.innerHTML = '❌ Aplikasi tidak ditemukan.<br><br><a href="index.html" style="color:var(--accent);">Kembali ke MMK MODS</a>';
        return;
    }

    const title = esc(item.name || 'MMK MODS');
    const version = esc(item.version || '1.0');
    const desc = esc(item.description || 'Ekosistem & Database Aplikasi Android Modded Premium dari MMK Team.');
    const image = esc(item.imageUrl || 'https://diverse-aqua-iq7wghij.edgeone.app/M.png');
    const size = esc(item.size || '0 MB');
    const android = esc(item.android || '5.0+');
    const category = esc(item.category || 'General');
    const downloadUrl = esc(item.downloadUrl || '#');

    // Update tab title & meta tag (hanya berlaku setelah halaman dibuka/dijalankan JS-nya)
    document.title = title + ' | MMK MODS';
    document.getElementById('metaDesc').setAttribute('content', desc);
    document.getElementById('ogUrl').setAttribute('content', window.location.href);
    document.getElementById('ogTitle').setAttribute('content', title);
    document.getElementById('ogDesc').setAttribute('content', desc);
    document.getElementById('ogImage').setAttribute('content', image);
    document.getElementById('twTitle').setAttribute('content', title);
    document.getElementById('twDesc').setAttribute('content', desc);
    document.getElementById('twImage').setAttribute('content', image);

    container.className = '';
    container.innerHTML = `
        <div class="apk-card">
            <div class="apk-top-flex">
                <div class="apk-icon-frame">
                    <img src="${image}" alt="${title}" onerror="this.style.display='none'; this.parentElement.textContent='📱';">
                </div>
                <div class="apk-main-info">
                    <span class="apk-title">${title}</span>
                    <span class="apk-version">Versi ${version}</span>
                    <div class="apk-badge-row">
                        <span class="apk-badge">💾 ${size}</span>
                        <span class="apk-badge">🤖 ${android}</span>
                        <span class="apk-badge">📁 ${category}</span>
                    </div>
                </div>
            </div>
            <div class="apk-desc-area">${desc}</div>
            <a href="${downloadUrl}" target="_blank" class="download-action-btn">⬇️ DOWNLOAD</a>
        </div>
        <a href="index.html?share=${encodeURIComponent(item.name)}" class="share-back-link">🔎 Lihat Aplikasi Lain di MMK MODS</a>
    `;
})();
</script>
  </body>
</html>
