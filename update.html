<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Dialog</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #3b82f6;
      --secondary-bg: #0b121f;
      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; display: flex; justify-content: center; align-items: flex-end;
      height: 100vh; padding-bottom: 48px; background: transparent;
      font-family: 'Montserrat', sans-serif; overflow: hidden;
    }
    .community-logo-container {
      width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
      background: #050914; border-radius: 50%; border: 2px solid var(--primary-bg);
      box-shadow: 0 0 15px var(--primary-bg); overflow: hidden;
    }
    .community-logo-img { width: 100%; height: 100%; object-fit: cover; }
    .dialog-icon-frame { width: 48px; height: 48px; }

    .middle-dialog {
      position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
      opacity: 0; width: 340px; max-width: 92vw; pointer-events: none;
      transition: all 0.55s var(--ease-out-expo); z-index: 50;
    }
    .middle-dialog.active-dialog {
      opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto;
    }
    .dialog-card {
      background: linear-gradient(160deg, #0d1526 0%, #050914 100%);
      border: 1.5px solid rgba(59,130,246,0.55);
      border-radius: 18px; padding: 16px 16px 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65), 0 0 24px rgba(59,130,246,0.15);
    }
    .dialog-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .dialog-title {
      font-family: 'Oswald', sans-serif; font-size: 22px; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, var(--primary-bg));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9ca3af; font-weight: 600;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .close-btn {
      background: rgba(255,255,255,0.06); border: 0; color: #fff; width: 28px; height: 28px;
      border-radius: 8px; font-size: 18px; cursor: pointer; line-height: 1;
    }
    .dialog-body { margin-bottom: 12px; color: #cbd5e1; font-size: 13px; line-height: 1.45; }
    .main-p { margin-bottom: 8px; }
    .detail-item { font-size: 12px; color: #94a3b8; padding: 2px 0; }
    .header-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

    .inner-feature-box {
      background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px 12px; margin: 10px 0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .inner-feature-box li {
      list-style: none; display: flex; gap: 8px; font-size: 12px; color: #e2e8f0; margin-bottom: 6px;
    }
    .inner-feature-box li:before {
      content: "✓"; color: var(--primary-bg); font-weight: bold; width: 14px; flex-shrink: 0;
    }
    .inner-feature-box li.extra-text { display: none; }
    .inner-feature-box li.extra-text.show-extra { display: flex; }
    .more-btn {
      background: none; border: 0; color: var(--primary-bg); font-size: 12px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
    }

    .apk-list-scroll { max-height: 180px; overflow-y: auto; margin-top: 8px; }
    .apk-list-scroll::-webkit-scrollbar { width: 4px; }
    .apk-list-scroll::-webkit-scrollbar-thumb { background: var(--primary-bg); border-radius: 4px; }
    .apk-list-status { text-align: center; color: #94a3b8; font-size: 12px; padding: 16px 8px; }
    .apk-list-status.is-error { color: #f87171; }

    .apk-card-mini {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 8px 10px; margin-bottom: 8px;
    }
    .apk-card-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .apk-card-icon { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: #111; }
    .apk-card-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .apk-card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .apk-card-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: #64748b; }
    .apk-card-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .btn-card-download {
      display: inline-block; text-decoration: none; text-align: center;
      background: var(--primary-bg); color: #fff; font-size: 11px; font-weight: 700;
      padding: 6px 10px; border-radius: 8px; min-width: 52px;
    }

    .dialog-footer-pills { display: flex; gap: 10px; width: 100%; margin-top: 12px; }
    .pill-btn {
      flex: 1; border: 0; border-radius: 10px; padding: 11px 8px; font-weight: 700;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .pill-primary { background: var(--primary-bg); color: #fff; }
    .pill-ghost { background: rgba(255,255,255,0.08); color: #e2e8f0; }

    .ui-wrapper { position: relative; width: 100%; }
    .tech-bar-bottom {
      margin-top: 10px; margin-left: 8px; color: #93c5fd; font-size: 11px; font-weight: 600;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    }
    .wa-options-card {
      position: absolute; bottom: calc(100% + 8px); left: 8px;
      background: #050914; border: 1.5px solid var(--primary-bg); border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); padding: 8px; min-width: 170px;
      display: flex; flex-direction: column; gap: 4px;
      opacity: 0; transform: translateY(8px) scale(0.95); pointer-events: none;
      transition: all 0.25s var(--ease-out-expo); z-index: 30;
    }
    .wa-options-card.show-wa { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .wa-option-item {
      color: #fff; font-size: 12px; font-weight: 600; text-decoration: none;
      padding: 9px 10px; border-radius: 9px; background: rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px;
    }
    .wa-option-item:hover { background: rgba(59,130,246,0.2); }
    .update-banner {
      display: none; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.4);
      border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12px; color: #bfdbfe;
    }
    .update-banner.show { display: block; }
    #webApksListView { display: none; }
  </style>
</head>
<body>
  <div class="ui-wrapper" id="mainUI">
    <div class="middle-dialog" id="middleDialog">
      <div class="dialog-card" id="mainDialog">
        <div class="dialog-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="dialog-icon-frame">
              <div class="community-logo-container">
                <img class="community-logo-img" src="https://i.ibb.co.com/fdKWDJJT/image.webp" alt="logo" onerror="this.style.display='none'"/>
              </div>
            </div>
            <div>
              <div class="dialog-title" id="brandTitle">UPDATE</div>
              <div class="header-meta" id="headerVer"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="status-badge"><span class="status-dot"></span><span>Online</span></div>
            <button class="close-btn" id="cancelBtn" type="button">&times;</button>
          </div>
        </div>

        <div class="update-banner" id="updateBanner">
          <strong id="updateTitle">Update tersedia</strong>
          <div id="updateMeta"></div>
        </div>

        <div class="dialog-body" id="descriptionView">
          <p class="main-p" id="mainMsg">Memuat informasi...</p>
          <ul class="inner-feature-box" id="featureList">
            <li>UI dialog remote dari GitHub</li>
            <li>Daftar APK dari apks.js</li>
            <li class="extra-text">Sign check tetap di DEX</li>
            <li class="extra-text">String sensitif di-hex di native</li>
          </ul>
          <button class="more-btn" id="moreTextBtn" type="button">More</button>
        </div>

        <div id="webApksListView">
          <div class="apk-list-scroll" id="dynamicApkContainer">
            <div class="apk-list-status">Memuat daftar aplikasi...</div>
          </div>
        </div>

        <div class="dialog-footer-pills">
          <button class="pill-btn pill-ghost" id="btnToggleAppList" type="button">More Apps</button>
          <button class="pill-btn pill-primary" id="btnPrimary" type="button">OK</button>
        </div>

        <div style="position:relative;">
          <a href="#" class="tech-bar-bottom" id="whatsappTrigger">WhatsApp Community</a>
          <div class="wa-options-card" id="waOptionsCard">
            <a class="wa-option-item" href="https://chat.whatsapp.com/LDzlBOXR3I12Rb79oy5TFJ" target="_blank">Grup</a>
            <a class="wa-option-item" href="https://whatsapp.com/channel/0029Vb7i2omLNSa3VM8Chc1A" target="_blank">Saluran 1</a>
            <a class="wa-option-item" href="https://whatsapp.com/channel/0029Vb7vQrL1yT22MFrBrR42" target="_blank">Saluran 2</a>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Ganti jika repo berbeda
  const APK_JS_RAW_URL = "https://raw.githubusercontent.com/botl71193-debug/Modapks/main/apks.js";

  const middleDialog = document.getElementById('middleDialog');
  const cancelBtn = document.getElementById('cancelBtn');
  const moreTextBtn = document.getElementById('moreTextBtn');
  const btnToggleAppList = document.getElementById('btnToggleAppList');
  const btnPrimary = document.getElementById('btnPrimary');
  const waTrigger = document.getElementById('whatsappTrigger');
  const waCard = document.getElementById('waOptionsCard');

  let myWebApksDatabase = [];
  let apkLoadState = "idle";
  let apkLoadError = "";
  let isViewingApks = false;
  let isTextExpanded = false;
  let currentItem = null;

  function bridge() {
    return window.AndroidInterface || window.Android || null;
  }

  function safeClose() {
    const b = bridge();
    if (!b) return;
    try {
      if (b.isForceUpdate && b.isForceUpdate()) return;
    } catch (e) {}
    try { b.closeDialog(); } catch (e) {}
  }

  function openExternal(url) {
    const b = bridge();
    if (b && b.openUrl) {
      try { b.openUrl(url); return; } catch (e) {}
    }
    window.open(url, '_blank');
  }

  async function fetchApkDatabase() {
    if (apkLoadState === "loading" || apkLoadState === "loaded") return;
    apkLoadState = "loading";
    try {
      const res = await fetch(APK_JS_RAW_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rawText = await res.text();
      const match = rawText.match(/const\s+apks\s*=\s*(\[[\s\S]*\])\s*;?\s*$/);
      if (!match) throw new Error("Format apks.js tidak dikenali");
      // JSON strict: pastikan apks.js memakai JSON valid (quote pada key)
      let parsed;
      try {
        parsed = JSON.parse(match[1]);
      } catch (e) {
        // fallback ringan: ganti key tanpa quote (hanya untuk format longgar)
        const fixed = match[1]
          .replace(/([,{]\s*)([a-zA-Z_][a-zA-Z0-9_]*)\s*:/g, '$1"$2":')
          .replace(/'/g, '"');
        parsed = JSON.parse(fixed);
      }
      myWebApksDatabase = Array.isArray(parsed) ? parsed : [];
      apkLoadState = "loaded";
    } catch (err) {
      apkLoadState = "error";
      apkLoadError = err && err.message ? err.message : "Gagal memuat data";
      console.error(err);
    }
    if (isViewingApks) buildDynamicApkRows();
    applyUpdateBanner();
  }

  function getLocalInfo() {
    const b = bridge();
    let pkg = "", vc = 0, vn = "";
    try { if (b) pkg = b.getPackageName() || ""; } catch (e) {}
    try { if (b) vc = b.getVersionCode() || 0; } catch (e) {}
    try { if (b) vn = b.getVersionName() || ""; } catch (e) {}
    return { pkg, vc, vn };
  }

  function parseVersionCode(item) {
    if (typeof item.versionCode === "number") return item.versionCode;
    if (item.versionCode != null) return parseInt(String(item.versionCode).replace(/\D/g, ""), 10) || 0;
    if (item.version) return parseInt(String(item.version).replace(/\D/g, ""), 10) || 0;
    return 0;
  }

  function applyUpdateBanner() {
    const { pkg, vc, vn } = getLocalInfo();
    document.getElementById('headerVer').textContent = (vn ? ("v" + vn) : "") + (vc ? (" (" + vc + ")") : "");

    if (apkLoadState !== "loaded") {
      document.getElementById('mainMsg').textContent =
        apkLoadState === "error" ? ("Gagal muat apks.js: " + apkLoadError) : "Memuat data update...";
      return;
    }

    let item = myWebApksDatabase.find(a => a.packageName && a.packageName === pkg);
    if (!item && myWebApksDatabase.length) item = myWebApksDatabase[0];
    currentItem = item || null;

    if (!item) {
      document.getElementById('mainMsg').textContent = "Tidak ada data APK untuk paket ini.";
      return;
    }

    const remoteVc = parseVersionCode(item);
    document.getElementById('brandTitle').textContent = item.name || "Update";

    if (remoteVc > vc) {
      const banner = document.getElementById('updateBanner');
      banner.classList.add('show');
      document.getElementById('updateTitle').textContent = "Update: " + (item.name || "App") + " " + (item.version || item.versionName || "");
      document.getElementById('updateMeta').textContent =
        "Terpasang: " + (vn || vc) + " → Baru: " + (item.version || item.versionName || remoteVc);
      document.getElementById('mainMsg').textContent = "Versi baru tersedia. Silakan unduh pembaruan.";
      btnPrimary.textContent = "Download";
      btnPrimary.onclick = function () {
        const url = item.downloadUrl || (item.links && Object.values(item.links)[0]) || "#";
        openExternal(url);
      };
    } else {
      document.getElementById('updateBanner').classList.remove('show');
      document.getElementById('mainMsg').textContent = "Anda memakai versi terbaru.";
      btnPrimary.textContent = "OK";
      btnPrimary.onclick = safeClose;
      // optional auto-close jika bukan force
      const b = bridge();
      try {
        if (b && !(b.isForceUpdate && b.isForceUpdate())) {
          /* biarkan user tutup manual agar UI tetap bisa dipakai untuk More Apps */
        }
      } catch (e) {}
    }
  }

  function buildDynamicApkRows() {
    const container = document.getElementById('dynamicApkContainer');
    container.innerHTML = "";
    if (apkLoadState === "loading" || apkLoadState === "idle") {
      container.innerHTML = '<div class="apk-list-status">Memuat daftar aplikasi...</div>';
      return;
    }
    if (apkLoadState === "error") {
      container.innerHTML = '<div class="apk-list-status is-error">Gagal memuat daftar aplikasi.<br>' + apkLoadError + '</div>';
      return;
    }
    if (!myWebApksDatabase.length) {
      container.innerHTML = '<div class="apk-list-status">Belum ada aplikasi tersedia.</div>';
      return;
    }
    myWebApksDatabase.forEach(apk => {
      const card = document.createElement('div');
      card.className = 'apk-card-mini';
      let actionsHtml;
      if (apk.links && typeof apk.links === 'object') {
        actionsHtml = '<div class="apk-card-actions">' +
          Object.entries(apk.links).map(([label, url]) =>
            '<a href="#" data-url="' + String(url).replace(/"/g, '&quot;') + '" class="btn-card-download js-dl">' + label + '</a>'
          ).join('') + '</div>';
      } else {
        actionsHtml = '<a href="#" data-url="' + String(apk.downloadUrl || '#').replace(/"/g, '&quot;') + '" class="btn-card-download js-dl">Get</a>';
      }
      card.innerHTML =
        '<div class="apk-card-left">' +
          '<img src="' + (apk.imageUrl || '') + '" alt="" class="apk-card-icon" onerror="this.src=\'https://i.ibb.co.com/fdKWDJJT/image.webp\'"/>' +
          '<div class="apk-card-info">' +
            '<div class="apk-card-title">' + (apk.name || '') + '</div>' +
            '<div class="apk-card-meta">' +
              '<span>' + (apk.version || apk.versionName || '') + '</span>' +
              '<span class="apk-card-meta-dot"></span>' +
              '<span>' + (apk.size || '') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' + actionsHtml;
      container.appendChild(card);
    });
    container.querySelectorAll('.js-dl').forEach(a => {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        openExternal(this.getAttribute('data-url'));
      });
    });
  }

  function toggleTextExpand() {
    isTextExpanded = !isTextExpanded;
    document.querySelectorAll('.extra-text').forEach(el => {
      if (isTextExpanded) el.classList.add('show-extra'); else el.classList.remove('show-extra');
    });
    moreTextBtn.textContent = isTextExpanded ? 'Less' : 'More';
  }

  function toggleAppList() {
    const descView = document.getElementById('descriptionView');
    const listView = document.getElementById('webApksListView');
    isViewingApks = !isViewingApks;
    if (isViewingApks) {
      descView.style.display = 'none';
      listView.style.display = 'block';
      btnToggleAppList.textContent = 'Back';
      buildDynamicApkRows();
    } else {
      descView.style.display = 'block';
      listView.style.display = 'none';
      btnToggleAppList.textContent = 'More Apps';
    }
  }

  function toggleWhatsappCard(e) {
    e.preventDefault();
    e.stopPropagation();
    waCard.classList.toggle('show-wa');
    return false;
  }

  moreTextBtn.addEventListener('click', toggleTextExpand);
  btnToggleAppList.addEventListener('click', toggleAppList);
  cancelBtn.addEventListener('click', safeClose);
  btnPrimary.addEventListener('click', safeClose);
  waTrigger.addEventListener('click', toggleWhatsappCard);
  document.addEventListener('click', function (e) {
    if (waCard.classList.contains('show-wa') && !waCard.contains(e.target) && !waTrigger.contains(e.target)) {
      waCard.classList.remove('show-wa');
    }
  });

  window.onload = function () {
    middleDialog.classList.add('active-dialog');
    fetchApkDatabase();
  };
</script>
</body>
</html>
